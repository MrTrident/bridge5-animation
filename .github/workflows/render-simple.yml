name: Render Bridge5 Animation

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Concurrency (max 50)'
        required: true
        default: '25'
        type: choice
        options: ['10', '25', '50']

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb

      - name: Render Bridge5 (67s @ 30fps = 2001 frames)
        run: |
          npx remotion render src/index.ts Bridge5 out/bridge5-full-67s.mp4 \
            --codec h264 --crf 16 --concurrency 25

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: bridge5-full-67s
          path: out/bridge5-full-67s.mp4
          retention-days: 30