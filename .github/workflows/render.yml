name: Render Animation

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Composition to render'
        required: true
        default: 'Bridge5'
        type: choice
        options:
          - Bridge5
      output:
        description: 'Output filename'
        required: true
        default: 'bridge5-full-67s.mp4'
      concurrency:
        description: 'Concurrency (max 50 for GitHub Actions)'
        required: true
        default: '50'
        type: choice
        options:
          - '10'
          - '25'
          - '50'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb

      - name: Render video
        env:
          REMOTION_SERIALIZE_OUTPUT: '1'
        run: |
          npx remotion render src/index.ts ${{ github.event.inputs.composition }} out/${{ github.event.inputs.output }} \
            --codec h264 \
            --crf 16 \
            --concurrency ${{ github.event.inputs.concurrency }} \
            --threads 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/${{ github.event.inputs.output }}
          retention-days: 7

      - name: Create Release (optional)
        if: github.event.inputs.composition == 'Bridge5'
        run: |
          gh release create "bridge5-$(date +%Y%m%d-%H%M)" out/${{ github.event.inputs.output }} \
            --title "Bridge5 Full 67s Render" \
            --notes "Auto-rendered via GitHub Actions"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}